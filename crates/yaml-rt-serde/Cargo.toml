[package]
name = "yaml-rt-serde"
description = "Serde integration for the yaml-rt YAML 1.2.2 parser"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/yaml-rt-serde"
keywords = ["yaml", "serde", "serialization", "deserialization", "configuration"]
categories = ["config", "encoding"]

[lib]
name = "yaml_rt_serde"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
yaml-rt-core.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
