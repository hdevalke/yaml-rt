[package]
name = "yaml-rt-bench"
description = "Parse benchmarks for yaml-rt and YAML parser baselines"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "profile_parse"
harness = false

[[bench]]
name = "profile_alloc"
harness = false

[dev-dependencies]
criterion = "0.5"
yaml-rt-core.workspace = true

[dependencies]
fyaml = { version = "0.5.0", optional = true }
saphyr = { version = "0.0.6", optional = true }

[features]
baselines = ["fyaml-baseline", "saphyr-baseline"]
fyaml-baseline = ["dep:fyaml"]
saphyr-baseline = ["dep:saphyr"]
