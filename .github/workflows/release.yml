name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump to calculate with Convco"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
      prerelease:
        description: "Optional prerelease label, for example rc, beta, or alpha"
        required: false
        default: ""
        type: string
      version:
        description: "Optional exact SemVer, for example 1.0.0 or 1.0.0-rc.1"
        required: false
        default: ""
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release readiness
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - name: Install stable toolchain
        run: >-
          rustup toolchain install
          --profile minimal
          stable
          --component clippy
          --component rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Test facade without default features
        run: cargo test -p yaml-rt --no-default-features --locked
      - name: Test facade derive feature
        run: cargo test -p yaml-rt --no-default-features --features derive --locked
      - name: Test facade Serde feature
        run: cargo test -p yaml-rt --no-default-features --features serde --locked
      - name: Test facade all features
        run: cargo test -p yaml-rt --all-features --locked
      - name: Run Clippy
        run: >-
          cargo clippy
          -p yaml-rt-core
          -p yaml-rt-derive
          -p yaml-rt-serde
          -p yaml-rt
          -p yaml-rt-cli
          --all-targets
          --all-features
          --locked
          --
          -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc
          -p yaml-rt-core
          -p yaml-rt-derive
          -p yaml-rt-serde
          -p yaml-rt
          -p yaml-rt-cli
          --all-features
          --no-deps
          --locked
      - name: Run all 402 YAML Test Suite cases
        env:
          YAML_TEST_SUITE_RUN_ALL: "1"
          YAML_TEST_SUITE_CHECK_JSON: "1"
        run: cargo test -p yaml-rt-core --test yaml_test_suite --locked
      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            yaml-rt-core
            yaml-rt-derive
            yaml-rt-serde
            yaml-rt
            yaml-rt-cli
          )
          for package in "${packages[@]}"; do
            cargo package --list --locked -p "${package}"
          done
          cargo package --locked -p yaml-rt-core
          cargo package --locked -p yaml-rt-derive
      - name: Compile default benchmarks
        run: cargo check -p yaml-rt-bench --benches --no-default-features --locked
      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Convco
        uses: convco/convco-action@v0.3.0
        with:
          convco_version: 0.7.0
      - name: Validate commit history
        run: convco check

  prepare:
    name: Prepare release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - name: Configure Git identity
        run: |
          git config --global user.email "2261239+hdevalke@users.noreply.github.com"
          git config --global user.name "convco-ci"
      - name: Install stable toolchain
        run: rustup toolchain install --profile minimal stable
      - name: Install Convco
        uses: convco/convco-action@v0.3.0
        with:
          convco_version: 0.7.0
      - name: Install cargo-release
        run: cargo install cargo-release --version 1.1.2 --locked
      - name: Calculate release version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${VERSION_OVERRIDE}" ]; then
            if [[ ! "${VERSION_OVERRIDE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "Invalid SemVer version: ${VERSION_OVERRIDE}" >&2
              exit 1
            fi
            VERSION="${VERSION_OVERRIDE}"
          else
            version_args=(
              version
              --bump
              --initial-bump-version
              0.1.0
            )
            case "${BUMP}" in
              auto) ;;
              major|minor|patch) version_args+=("--${BUMP}") ;;
              *)
                echo "Invalid bump input: ${BUMP}" >&2
                exit 1
                ;;
            esac
            if [ -n "${PRERELEASE}" ]; then
              version_args+=(--prerelease "${PRERELEASE}")
            fi
            VERSION="$(convco "${version_args[@]}")"
          fi

          TAG="v${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
      - name: Validate release version
        run: >-
          cargo release version "${{ steps.version.outputs.version }}"
          --workspace
          --exclude yaml-rt-bench
          --no-confirm
      - name: Create release commit and tag
        run: >-
          cargo release "${{ steps.version.outputs.version }}"
          --workspace
          --exclude yaml-rt-bench
          --execute
          --no-confirm
          --no-publish

  build-binaries:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-unknown-linux-musl
            binary: yaml-rt
            target: x86_64-unknown-linux-musl
            cross: false
          - os: ubuntu-latest
            name: aarch64-unknown-linux-musl
            binary: yaml-rt
            target: aarch64-unknown-linux-musl
            cross: true
          - os: macos-latest
            name: macos
            binary: yaml-rt
            target: ""
            cross: false
          - os: windows-latest
            name: windows
            binary: yaml-rt.exe
            target: ""
            cross: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install stable toolchain
        if: ${{ !matrix.cross }}
        run: rustup toolchain install --profile minimal stable
      - name: Add Rust target
        if: matrix.target != '' && !matrix.cross
        run: rustup target add ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: matrix.cross
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
        if: matrix.cross
      - name: Build targeted binary
        if: matrix.target != ''
        run: cargo build --release --locked -p yaml-rt-cli --bin yaml-rt --target ${{ matrix.target }}
      - name: Build native binary
        if: matrix.target == ''
        run: cargo build --release --locked -p yaml-rt-cli --bin yaml-rt
      - name: Package archives
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          TARGET="${{ matrix.target }}"
          if [ -z "${TARGET}" ]; then
            TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          fi

          VERSIONED="yaml-rt-v${VERSION}-${TARGET}"
          ALIAS="yaml-rt-${TARGET}"
          mkdir -p "dist/${VERSIONED}"

          if [ -n "${{ matrix.target }}" ]; then
            BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          else
            BIN_PATH="target/release/${{ matrix.binary }}"
          fi

          cp "${BIN_PATH}" "dist/${VERSIONED}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${VERSIONED}/"
          tar -czf "dist/${VERSIONED}.tar.gz" -C dist "${VERSIONED}"

          cp -R "dist/${VERSIONED}" "dist/${ALIAS}"
          tar -czf "dist/${ALIAS}.tar.gz" -C dist "${ALIAS}"

          pushd dist >/dev/null
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${VERSIONED}.tar.gz" > "${VERSIONED}.tar.gz.sha256"
            sha256sum "${ALIAS}.tar.gz" > "${ALIAS}.tar.gz.sha256"
          else
            shasum -a 256 "${VERSIONED}.tar.gz" > "${VERSIONED}.tar.gz.sha256"
            shasum -a 256 "${ALIAS}.tar.gz" > "${ALIAS}.tar.gz.sha256"
          fi
          popd >/dev/null

          echo "archive=${VERSIONED}" >> "${GITHUB_OUTPUT}"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish-crates:
    name: Publish crates.io
    needs:
      - prepare
      - build-binaries
    runs-on: ubuntu-latest
    environment: release
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - name: Install stable toolchain
        run: rustup toolchain install --profile minimal stable
      - name: Install cargo-release
        run: cargo install cargo-release --version 1.1.2 --locked
      - name: Publish workspace
        run: >-
          cargo release publish
          --workspace
          --exclude yaml-rt-bench
          --execute
          --no-confirm
          --allow-branch '*'

  smoke-test:
    name: Smoke-test crates.io
    needs:
      - prepare
      - publish-crates
    runs-on: ubuntu-latest
    steps:
      - name: Install stable toolchain
        run: rustup toolchain install --profile minimal stable
      - name: Wait for all packages
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          packages=(
            yaml-rt-core
            yaml-rt-derive
            yaml-rt-serde
            yaml-rt-cli
            yaml-rt
          )
          for attempt in {1..30}; do
            missing=()
            for package in "${packages[@]}"; do
              if ! cargo info "${package}@${VERSION}" >/dev/null 2>&1; then
                missing+=("${package}")
              fi
            done
            if [ "${#missing[@]}" -eq 0 ]; then
              exit 0
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "Packages not visible after 5 minutes: ${missing[*]}" >&2
              exit 1
            fi
            echo "Waiting for crates.io: ${missing[*]}"
            sleep 10
          done
      - name: Compile external consumers
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/yaml-rt-consumers"

          cargo new --quiet --lib "${ROOT}/default"
          cargo add --manifest-path "${ROOT}/default/Cargo.toml" "yaml-rt@=${VERSION}"
          cargo check --manifest-path "${ROOT}/default/Cargo.toml" --locked

          cargo new --quiet --lib "${ROOT}/no-default"
          cargo add --manifest-path "${ROOT}/no-default/Cargo.toml" \
            "yaml-rt@=${VERSION}" --no-default-features
          cargo check --manifest-path "${ROOT}/no-default/Cargo.toml" --locked

          cargo new --quiet --lib "${ROOT}/serde"
          cargo add --manifest-path "${ROOT}/serde/Cargo.toml" \
            "yaml-rt@=${VERSION}" --no-default-features --features serde
          cargo check --manifest-path "${ROOT}/serde/Cargo.toml" --locked

          cargo new --quiet --lib "${ROOT}/all-features"
          cargo add --manifest-path "${ROOT}/all-features/Cargo.toml" \
            "yaml-rt@=${VERSION}" --features derive,serde
          cargo check --manifest-path "${ROOT}/all-features/Cargo.toml" --locked
      - name: Install and exercise published CLI
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          INSTALL_ROOT="${RUNNER_TEMP}/yaml-rt-install"
          CLI="${INSTALL_ROOT}/bin/yaml-rt"
          cargo install yaml-rt-cli --version "=${VERSION}" --locked \
            --root "${INSTALL_ROOT}"
          test "$("${CLI}" --version)" = "yaml-rt ${VERSION}"

          printf 'port: 8080 # keep this comment\n' > "${RUNNER_TEMP}/input.yaml"
          printf 'port: 9090 # keep this comment\n' > "${RUNNER_TEMP}/expected.yaml"
          "${CLI}" replace /port --value 9090 "${RUNNER_TEMP}/input.yaml" \
            > "${RUNNER_TEMP}/output.yaml"
          cmp "${RUNNER_TEMP}/expected.yaml" "${RUNNER_TEMP}/output.yaml"

  github-release:
    name: Create GitHub release
    needs:
      - prepare
      - build-binaries
      - publish-crates
      - smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - name: Install stable toolchain
        run: rustup toolchain install --profile minimal stable
      - name: Install Convco
        uses: convco/convco-action@v0.3.0
        with:
          convco_version: 0.7.0
      - name: Generate release notes
        run: convco changelog --no-links --max-versions 1 -o release-notes.md
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: yaml-rt-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" dist/* \
            --repo "${{ github.repository }}" \
            --title "yaml-rt ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
