name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'yaml-rt-*/v*'
      - 'yaml-rt/v*'

# Serialize publication across all packages, including dependent release tags.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    name: Validate immutable package tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate package, version, ancestry and successful main CI
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release validate-tag "$RELEASE_TAG"

  publish:
    name: Publish selected package
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install stable toolchain
        run: rustup toolchain install --profile minimal stable
      - name: Verify and publish only the tagged package, or resume
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/release publish "$RELEASE_TAG"

  build-binaries:
    name: Build ${{ matrix.name }}
    needs: validate
    if: needs.validate.outputs.package == 'yaml-rt-cli'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-unknown-linux-musl
            binary: yaml-rt
            target: x86_64-unknown-linux-musl
            cross: false
          - os: ubuntu-latest
            name: aarch64-unknown-linux-musl
            binary: yaml-rt
            target: aarch64-unknown-linux-musl
            cross: true
          - os: macos-latest
            name: macos
            binary: yaml-rt
            target: ""
            cross: false
          - os: windows-latest
            name: windows
            binary: yaml-rt.exe
            target: ""
            cross: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install stable toolchain
        if: ${{ !matrix.cross }}
        run: rustup toolchain install --profile minimal stable
      - name: Add Rust target
        if: matrix.target != '' && !matrix.cross
        run: rustup target add ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: matrix.cross
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
        if: matrix.cross
      - name: Build targeted binary
        if: matrix.target != ''
        run: cargo build --release --locked -p yaml-rt-cli --bin yaml-rt --target ${{ matrix.target }}
      - name: Build native binary
        if: matrix.target == ''
        run: cargo build --release --locked -p yaml-rt-cli --bin yaml-rt
      - name: Package archives
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          TARGET="${{ matrix.target }}"
          if [ -z "${TARGET}" ]; then
            TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          fi

          VERSIONED="yaml-rt-v${VERSION}-${TARGET}"
          ALIAS="yaml-rt-${TARGET}"
          mkdir -p "dist/${VERSIONED}"

          if [ -n "${{ matrix.target }}" ]; then
            BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          else
            BIN_PATH="target/release/${{ matrix.binary }}"
          fi

          if [ "${{ matrix.cross }}" = false ]; then
            test "$("${BIN_PATH}" --version)" = "yaml-rt ${VERSION}"
          fi
          cp "${BIN_PATH}" "dist/${VERSIONED}/"
          cp crates/yaml-rt-cli/README.md LICENSE-MIT LICENSE-APACHE "dist/${VERSIONED}/"
          tar -czf "dist/${VERSIONED}.tar.gz" -C dist "${VERSIONED}"

          cp -R "dist/${VERSIONED}" "dist/${ALIAS}"
          tar -czf "dist/${ALIAS}.tar.gz" -C dist "${ALIAS}"

          pushd dist >/dev/null
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${VERSIONED}.tar.gz" > "${VERSIONED}.tar.gz.sha256"
            sha256sum "${ALIAS}.tar.gz" > "${ALIAS}.tar.gz.sha256"
          else
            shasum -a 256 "${VERSIONED}.tar.gz" > "${VERSIONED}.tar.gz.sha256"
            shasum -a 256 "${ALIAS}.tar.gz" > "${ALIAS}.tar.gz.sha256"
          fi
          popd >/dev/null

          echo "archive=${VERSIONED}" >> "${GITHUB_OUTPUT}"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          # Retryable build intermediates; published Release assets are never overwritten.
          overwrite: true
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  smoke-test:
    name: Smoke-test selected published package
    needs: [validate, publish]
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ needs.validate.outputs.package }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Install stable toolchain
        run: rustup toolchain install --profile minimal stable
      - name: Compile external library consumers
        if: needs.validate.outputs.package != 'yaml-rt-cli'
        shell: bash
        run: |
          set -euo pipefail
          CONSUMER_ROOT="${RUNNER_TEMP}/consumers"
          cargo new --quiet --lib "${CONSUMER_ROOT}/default"
          cargo add --manifest-path "${CONSUMER_ROOT}/default/Cargo.toml" "${PACKAGE}@=${VERSION}"
          cargo check --manifest-path "${CONSUMER_ROOT}/default/Cargo.toml" --locked
          if [ "$PACKAGE" = yaml-rt ]; then
            for features in none derive serde derive,serde; do
              destination="${CONSUMER_ROOT}/${features}"
              cargo new --quiet --lib --name consumer "$destination"
              options=(--no-default-features)
              if [ "$features" != none ]; then
                options+=(--features "$features")
              fi
              cargo add --manifest-path "$destination/Cargo.toml" "yaml-rt@=${VERSION}" "${options[@]}"
              cargo check --manifest-path "$destination/Cargo.toml" --locked
            done
          fi
      - name: Install and exercise published CLI
        if: needs.validate.outputs.package == 'yaml-rt-cli'
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_ROOT="${RUNNER_TEMP}/yaml-rt-install"
          CLI="${INSTALL_ROOT}/bin/yaml-rt"
          cargo install yaml-rt-cli --version "=${VERSION}" --locked --root "$INSTALL_ROOT"
          test "$("$CLI" --version)" = "yaml-rt ${VERSION}"
          printf 'port: 8080 # keep this comment\n' > "${RUNNER_TEMP}/input.yaml"
          printf 'port: 9090 # keep this comment\n' > "${RUNNER_TEMP}/expected.yaml"
          "$CLI" replace /port --value 9090 "${RUNNER_TEMP}/input.yaml" > "${RUNNER_TEMP}/output.yaml"
          cmp "${RUNNER_TEMP}/expected.yaml" "${RUNNER_TEMP}/output.yaml"

  github-release:
    name: Complete CLI GitHub Release
    needs: [validate, publish, smoke-test, build-binaries]
    if: needs.validate.outputs.package == 'yaml-rt-cli'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: yaml-rt-*
          path: dist
          merge-multiple: true
      - name: Resume immutable archives and checksum pairs
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release assets "$RELEASE_TAG" dist
