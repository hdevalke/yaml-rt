[workspace]
members = [
    "crates/yaml-rt-core",
    "crates/yaml-rt-rfc9535",
    "crates/yaml-rt-derive",
    "crates/yaml-rt-serde",
    "crates/yaml-rt-cli",
    "crates/yaml-rt-wasm",
    "crates/yaml-rt",
    "crates/yaml-rt-bench",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.4"
license = "MIT OR Apache-2.0"
authors = ["Hannes De Valkeneer <hannes@de-valkeneer.be>"]
readme = "README.md"
repository = "https://github.com/hdevalke/yaml-rt"
rust-version = "1.96"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
yaml-rt-core = { version = "0.2.4", path = "crates/yaml-rt-core" }
yaml-rt-rfc9535 = { version = "0.2.4", path = "crates/yaml-rt-rfc9535" }
yaml-rt-derive = { version = "0.2.4", path = "crates/yaml-rt-derive" }
yaml-rt-serde = { version = "0.2.4", path = "crates/yaml-rt-serde" }
proc-macro2 = "1"
quote = "1"
regex = "1"
serde = "1"
syn = { version = "3", features = ["derive"] }
wasm-bindgen = "=0.2.127"
