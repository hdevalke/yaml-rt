[package]
name = "yaml-rt-bench"
description = "Parse benchmarks for yaml-rt and YAML parser baselines"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "profile_parse"
harness = false

[[bench]]
name = "profile_alloc"
harness = false

[dev-dependencies]
criterion = "0.8.2"

[dependencies]
saphyr = { version = "0.0.6", optional = true }
yaml-rt-core.workspace = true

[build-dependencies]
cc = "1.2.65"

[features]
baselines = ["rapidyaml-baseline", "saphyr-baseline"]
rapidyaml-baseline = []
saphyr-baseline = ["dep:saphyr"]
