[package]
name = "yaml-rt"
description = "Facade crate for YAML 1.2.2 round-trip parsing and typed overlays"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/yaml-rt"
keywords = ["yaml", "parser", "round-trip", "serde", "configuration"]
categories = ["config", "parser-implementations"]

[lib]
name = "yaml_rt"
path = "src/lib.rs"

[features]
default = ["derive"]
derive = ["dep:yaml-rt-derive"]
serde = ["dep:yaml-rt-serde"]

[dependencies]
yaml-rt-core.workspace = true
yaml-rt-derive = { workspace = true, optional = true }
yaml-rt-serde = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }

[[example]]
name = "typed_config"
required-features = ["derive"]

[[example]]
name = "config_models"
required-features = ["derive"]

[[example]]
name = "enum_overlays"
required-features = ["derive"]

[[example]]
name = "nested_edit"
required-features = ["derive"]

[[example]]
name = "multi_document"
required-features = ["derive"]

[[test]]
name = "derive_mvp"
required-features = ["derive"]

[[test]]
name = "derive_attributes"
required-features = ["derive"]

[[test]]
name = "derive_enums"
required-features = ["derive"]

[[test]]
name = "derive_newtypes"
required-features = ["derive"]

[[test]]
name = "derive_struct_shapes"
required-features = ["derive"]

[[test]]
name = "usefulness_target"
required-features = ["derive"]

[[test]]
name = "serde_facade"
required-features = ["serde"]

[package.metadata.docs.rs]
all-features = true
