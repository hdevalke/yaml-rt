# Local preparation only. Publication belongs to the protected tag workflow.
# Tool version: cargo-release 1.1.5.
shared-version = false
dependent-version = "fix"
consolidate-commits = false
publish = false
tag = false
push = false
allow-branch = ["*"]
pre-release-commit-message = "chore(release): prepare {{crate_name}} {{version}}"
tag-name = "{{crate_name}}/v{{version}}"
tag-message = "Release {{crate_name}} {{version}}"
